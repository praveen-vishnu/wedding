<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Praveen ♡ Supriya — Two States, One Heart</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{background:#070308;overflow:hidden;width:100vw;height:100vh;
  display:flex;align-items:center;justify-content:center;cursor:none}
#wrap{position:relative;width:100%;height:100%;display:flex;
  align-items:center;justify-content:center}
#scene{display:block;flex-shrink:0;width:1280px;height:720px;
  transform-origin:top left;transform:scale(var(--s,1))}

/* ── CSS Animations ── */
@keyframes heartPulse{
  0%,100%{transform:scale(1)}
  14%{transform:scale(1.07)}
  28%{transform:scale(1)}
  42%{transform:scale(1.04)}
}
@keyframes fireDance{
  0%,100%{transform:scaleY(1) scaleX(1) translateY(0)}
  20%{transform:scaleY(1.18) scaleX(.88) translateY(-6px)}
  50%{transform:scaleY(.92) scaleX(1.1) translateY(3px)}
  75%{transform:scaleY(1.12) scaleX(.93) translateY(-4px)}
}
@keyframes glowPulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes outerGlow{0%,100%{opacity:.3;r:60}50%{opacity:.7;r:75}}
@keyframes armFloat{
  0%,100%{transform:translateY(0) translateX(0)}
  33%{transform:translateY(-9px) translateX(5px)}
  66%{transform:translateY(6px) translateX(-4px)}
}
@keyframes ftSpark{0%,100%{r:8;opacity:.5}50%{r:20;opacity:1}}
@keyframes borderShimmer{to{stroke-dashoffset:-60}}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:1}}
@keyframes petalFall{
  0%{opacity:0;transform:translateY(0) rotate(0deg) translateX(0)}
  8%{opacity:.9}
  92%{opacity:.7}
  100%{opacity:0;transform:translateY(-640px) rotate(480deg) translateX(var(--dx,30px))}
}
@keyframes nameGlow{
  0%,100%{filter:drop-shadow(0 0 10px rgba(255,215,0,.5))}
  50%{filter:drop-shadow(0 0 26px rgba(255,215,0,1))}
}
@keyframes cityPing{0%{r:5;opacity:.9}100%{r:26;opacity:0}}
@keyframes fireRise{
  0%{opacity:.8;transform:scaleY(1) translateY(0)}
  100%{opacity:0;transform:scaleY(.3) translateY(-40px)}
}

.heart-group{animation:heartPulse 2s ease-in-out infinite;transform-origin:640px 305px}
.heart-aura{animation:glowPulse 2s ease-in-out infinite}
.groom-arm{animation:armFloat 2.8s ease-in-out infinite;transform-origin:368px 228px}
.bride-arm{animation:armFloat 2.8s ease-in-out .9s infinite reverse;transform-origin:912px 228px}
.ft-spark{animation:ftSpark 1.8s ease-in-out infinite}
.name-glow{animation:nameGlow 3s ease-in-out infinite}
</style>
</head>
<body>
<div id="wrap">
<svg id="scene" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg"
  preserveAspectRatio="xMidYMid meet">
<defs>

<!-- ══ GRADIENTS ══ -->
<linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="0%">

  <stop offset="18%"  stop-color="#820C10"/>
  <stop offset="38%"  stop-color="#BC3810"/>
  <stop offset="50%"  stop-color="#D87010"/>
  <stop offset="62%"  stop-color="#A06010"/>
  <stop offset="78%"  stop-color="#105840"/>
  <stop offset="90%"  stop-color="#083828"/>
  <stop offset="100%" stop-color="#041C14"/>
</linearGradient>
<linearGradient id="bgVert" x1="0%" y1="0%" x2="0%" y2="100%">
  <stop offset="0%"   stop-color="#000" stop-opacity=".5"/>
  <stop offset="25%"  stop-color="#000" stop-opacity="0"/>
  <stop offset="75%"  stop-color="#000" stop-opacity="0"/>
  <stop offset="100%" stop-color="#000" stop-opacity=".6"/>
</linearGradient>
<!-- Character glow auras -->
<radialGradient id="kaAura" cx="50%" cy="55%" r="55%">
  <stop offset="0%"   stop-color="#C03010" stop-opacity=".28"/>
  <stop offset="100%" stop-color="#C03010" stop-opacity="0"/>
</radialGradient>
<radialGradient id="tgAura" cx="50%" cy="55%" r="55%">
  <stop offset="0%"   stop-color="#107050" stop-opacity=".28"/>
  <stop offset="100%" stop-color="#107050" stop-opacity="0"/>
</radialGradient>
<!-- Heart fire fill (left/KA side) -->
<radialGradient id="heartFireKA" cx="35%" cy="55%" r="65%">
  <stop offset="0%"   stop-color="#FF9010" stop-opacity="1"/>
  <stop offset="35%"  stop-color="#E04010" stop-opacity=".9"/>
  <stop offset="75%"  stop-color="#901010" stop-opacity=".85"/>
  <stop offset="100%" stop-color="#500808" stop-opacity=".9"/>
</radialGradient>
<!-- Heart fire fill (right/TG side) -->
<radialGradient id="heartFireTG" cx="65%" cy="55%" r="65%">
  <stop offset="0%"   stop-color="#10C880" stop-opacity=".9"/>
  <stop offset="35%"  stop-color="#108060" stop-opacity=".85"/>
  <stop offset="75%"  stop-color="#084838" stop-opacity=".9"/>
  <stop offset="100%" stop-color="#022818" stop-opacity=".9"/>
</radialGradient>
<!-- Center meeting-point blaze -->
<radialGradient id="meetBlaze" cx="50%" cy="85%" r="50%">
  <stop offset="0%"   stop-color="#FFFFFF" stop-opacity=".95"/>
  <stop offset="15%"  stop-color="#FFE040" stop-opacity=".9"/>
  <stop offset="40%"  stop-color="#FF9010" stop-opacity=".7"/>
  <stop offset="100%" stop-color="#FF4400" stop-opacity="0"/>
</radialGradient>
<!-- Heart outer aura -->
<radialGradient id="heartAura" cx="50%" cy="60%" r="50%">
  <stop offset="0%"   stop-color="#FFA020" stop-opacity=".5"/>
  <stop offset="50%"  stop-color="#FF5010" stop-opacity=".2"/>
  <stop offset="100%" stop-color="#FF2000" stop-opacity="0"/>
</radialGradient>
<!-- Skin tones -->
<linearGradient id="skin" x1="0%" y1="0%" x2="0%" y2="100%">
  <stop offset="0%"   stop-color="#D8A870"/>
  <stop offset="100%" stop-color="#B87848"/>
</linearGradient>
<!-- Fingertip sparkle -->
<radialGradient id="ftGradient" cx="50%" cy="50%" r="50%">
  <stop offset="0%"   stop-color="#FFFFFF"/>
  <stop offset="30%"  stop-color="#FFD700"/>
  <stop offset="100%" stop-color="#FFD700" stop-opacity="0"/>
</radialGradient>
<!-- Flame gradient -->
<radialGradient id="flameGrad" cx="50%" cy="80%" r="55%">
  <stop offset="0%"   stop-color="#FFFFFF"/>
  <stop offset="25%"  stop-color="#FFE040"/>
  <stop offset="60%"  stop-color="#FF6010"/>
  <stop offset="100%" stop-color="#FF2000" stop-opacity="0"/>
</radialGradient>

<!-- ══ FILTERS ══ -->
<filter id="glow4" x="-40%" y="-40%" width="180%" height="180%">
  <feGaussianBlur stdDeviation="4" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="glow10" x="-50%" y="-50%" width="200%" height="200%">
  <feGaussianBlur stdDeviation="10" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="glow22" x="-60%" y="-60%" width="220%" height="220%">
  <feGaussianBlur stdDeviation="22" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
  <feGaussianBlur stdDeviation="12" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="charShadow">
  <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#FF8800" flood-opacity=".2"/>
</filter>
<filter id="mapBlur" x="-5%" y="-5%" width="110%" height="110%">
  <feGaussianBlur stdDeviation="3"/>
</filter>

<!-- ══ CLIP PATHS ══ -->
<clipPath id="heartClip">
  <!-- Heart path for clipping internal map content -->
  <path d="M640,530 C568,465 415,400 415,285 C415,228 455,195 500,195
           C523,195 545,207 640,268 C735,207 757,195 780,195
           C825,195 865,228 865,285 C865,400 712,465 640,530Z"/>
</clipPath>
<clipPath id="leftHalf">
  <rect x="0" y="0" width="640" height="720"/>
</clipPath>
<clipPath id="rightHalf">
  <rect x="640" y="0" width="640" height="720"/>
</clipPath>

<!-- ══ PATTERNS ══ -->
<!-- Mysore silk (top/bottom border) -->
<pattern id="mysore" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">

<!-- Pochampally ikat (bottom border) -->

</defs>

<script>
// ══ RESPONSIVE SCALE ══
(function scaleScene() {
  function fit() {
    const s = Math.min(window.innerWidth / 1280, window.innerHeight / 720, 1);
    document.getElementById('scene').style.transform = `scale(${s})`;
    document.getElementById('scene').style.marginLeft =
      `${(window.innerWidth - 1280 * s) / 2}px`;
  }
  fit(); window.addEventListener('resize', fit);
})();

// ══ MOUSE PARALLAX ══
(function parallax() {
  const scene = document.getElementById('scene');
  // layers: [element-id, xFactor, yFactor]
  const layers = [
    ['groom',      0.018,  0.012],
    ['bride',     -0.018,  0.012],
    ['p-glow-ka',  0.028,  0.018],
    ['p-glow-tg', -0.028,  0.018],
  ];

  let cx = 640, cy = 360;
  window.addEventListener('mousemove', e => {
    const rect = scene.getBoundingClientRect();
    const s = parseFloat(scene.style.transform.replace('scale(','')) || 1;
    // mouse position relative to scene center (unscaled)
    const mx = (e.clientX - rect.left) / s - 640;
    const my = (e.clientY - rect.top)  / s - 360;
    // smooth via rAF
    cx += (mx - cx) * 0.08;
    cy += (my - cy) * 0.08;
  });

  function tick() {
    layers.forEach(([id, xf, yf]) => {
      const el = document.getElementById(id);
      if (el) el.style.transform = `translate(${cx * xf}px, ${cy * yf}px)`;
    });
    requestAnimationFrame(tick);
  }
  tick();
})();

// ══ PARTICLE SYSTEM (gold sparks around heart) ══
(function particles() {
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');

  function resize() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  // Map heart-centre (in scene coords) to screen coords
  function heartCentre() {
    const scene = document.getElementById('scene');
    const rect = scene.getBoundingClientRect();
    const s = parseFloat(scene.style.transform.replace('scale(','').replace(')','')) || 1;
    return {
      x: rect.left + 640 * s,
      y: rect.top  + 305 * s,
      s
    };
  }

  const particles = [];
  function spawn() {
    const { x, y, s } = heartCentre();
    const angle = Math.random() * Math.PI * 2;
    const r = (Math.random() * 180 + 20) * s;
    particles.push({
      x: x + Math.cos(angle) * r,
      y: y + Math.sin(angle) * r,
      vx: (Math.random() - .5) * 1.2,
      vy: -Math.random() * 1.4 - .4,
      life: 1,
      decay: Math.random() * .015 + .008,
      size: (Math.random() * 3 + 1) * s,
      color: Math.random() < .6
        ? `rgba(255,${Math.floor(180 + Math.random()*75)},0,`
        : `rgba(255,255,${Math.floor(Math.random()*80)},`
    });
  }

  let spawnTimer = 0;
  function loop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    spawnTimer++;
    if (spawnTimer % 3 === 0) spawn();

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy;
      p.vy -= .015; // slight upward drift
      p.life -= p.decay;
      if (p.life <= 0) { particles.splice(i,1); continue; }
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
      ctx.fillStyle = p.color + p.life.toFixed(2) + ')';
      ctx.fill();
      // tiny glow
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * 2.5, 0, Math.PI*2);
      ctx.fillStyle = p.color + (p.life * .3).toFixed(2) + ')';
      ctx.fill();
    }
    requestAnimationFrame(loop);
  }
  loop();
})();

// ══ GSAP Entrance ══
document.addEventListener('DOMContentLoaded', () => {
  if (typeof gsap === 'undefined') return;
  gsap.set('#groom', { x: -120, opacity: 0 });
  gsap.set('#bride', { x:  120, opacity: 0 });
  gsap.set('.heart-group', { scale: 0, opacity: 0, transformOrigin: '640px 305px' });
  gsap.set('#scene text', { opacity: 0 });

  const tl = gsap.timeline();
  tl.to('#groom', { x:0, opacity:1, duration:1.2, ease:'power3.out' }, .3)
    .to('#bride', { x:0, opacity:1, duration:1.2, ease:'power3.out' }, .3)
    .to('.heart-group', { scale:1, opacity:1, duration:1, ease:'back.out(1.6)' }, .9)
    .to('#scene text', { opacity:1, duration:.8, stagger:.1, ease:'power2.out' }, 1.4);
});
</script>
